[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/registration/complete"
  [headers.values]
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/payment-success"
  [headers.values]
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/payment-review"
  [headers.values]
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"
